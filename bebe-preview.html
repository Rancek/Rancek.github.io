<!doctype html><html><meta charset="utf-8"><title>Bebé — revisión de texturas</title><style>body{margin:0;background:#071321}canvas{display:block}p{position:absolute;color:#bdeeff;font:18px sans-serif;left:25px}</style><p>Bebé · Texturas de cara, cuerpo y ojos cartoon</p><script type="module">
import * as T from './assets/vendor/three.module.js';import {OBJLoader} from './assets/vendor/OBJLoader.js';const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color('#071321');const c=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);c.position.set(0,1,10);s.add(new T.HemisphereLight(0xffffff,0x637d99,2));const l=new T.DirectionalLight(0xffffff,2);l.position.set(3,4,7);s.add(l);const maps=await Promise.all(['cuerpo_textura.png','cara_textura.png','ojos_textura3.svg'].map(async n=>{const t=await new T.TextureLoader().loadAsync('./assets/models/'+n);t.colorSpace=T.SRGBColorSpace;return t;}));const mats=maps.map((map,i)=>new T.MeshStandardMaterial({map,roughness:i===2?.25:.8}));const m=await new OBJLoader().loadAsync('./assets/models/bebe.obj');m.traverse(o=>{if(o.isMesh){const f=a=>mats[a.name.includes('lambert5')?2:a.name.includes('lambert4')?1:0];o.material=Array.isArray(o.material)?o.material.map(f):f(o.material);}});const b=new T.Box3().setFromObject(m);const size=b.getSize(new T.Vector3()),mid=b.getCenter(new T.Vector3());m.position.sub(mid);const g=new T.Group();g.add(m);g.scale.setScalar(5/Math.max(size.x,size.y,size.z));s.add(g);c.lookAt(0,.3,0);r.render(s,c);
</script></html>
