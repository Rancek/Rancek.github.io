<!doctype html><html><meta charset="utf-8"><title>Cabeza — revisión de texturas</title><style>body{margin:0;background:#071321}canvas{display:block}p{position:absolute;color:#bdeeff;font:18px sans-serif;left:25px}</style><p>Cabeza · Color y mapa de normales</p><script type="module">
import * as T from './assets/vendor/three.module.js';import {OBJLoader} from './assets/vendor/OBJLoader.js';const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color('#071321');const c=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);c.position.set(0,1,10);s.add(new T.HemisphereLight(0xffffff,0x637d99,2));const l=new T.DirectionalLight(0xffffff,2);l.position.set(3,4,7);s.add(l);const maps=await Promise.all(['cabeza-color.jpg','cabeza-normal.jpg'].map(async n=>{const t=await new T.TextureLoader().loadAsync('./assets/models/'+n);t.colorSpace=T.SRGBColorSpace;return t;}));maps[1].colorSpace=T.NoColorSpace;const mat=new T.MeshStandardMaterial({map:maps[0],normalMap:maps[1],normalScale:new T.Vector2(.65,.65),roughness:.72});const mats=[mat,mat,mat];const m=await new OBJLoader().loadAsync('./assets/models/Cabeza.obj');m.traverse(o=>{if(o.isMesh){const f=a=>mats[a.name.includes('lambert5')?2:a.name.includes('lambert4')?1:0];o.material=Array.isArray(o.material)?o.material.map(f):f(o.material);}});const b=new T.Box3().setFromObject(m);const size=b.getSize(new T.Vector3()),mid=b.getCenter(new T.Vector3());m.position.sub(mid);const g=new T.Group();g.add(m);g.scale.setScalar(5/Math.max(size.x,size.y,size.z));s.add(g);c.lookAt(0,.3,0);r.render(s,c);
</script></html>
